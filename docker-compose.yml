services:
  postgres:
    image: postgres:16
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_dev
    # Host port 5433 avoids clashing with a local PostgreSQL on 5432.
    # The backend talks to postgres:5432 on the Compose network.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    restart: unless-stopped
    # Host 6335 avoids clashing with a standalone Qdrant on 6333.
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; a bash TCP probe is enough to know the
      # HTTP listener is accepting connections.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY:-dev-secret-key-change-me}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agent_dev
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agent_test
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_MCP_URL: https://mcp.tavily.com/mcp/
      CORS_ORIGINS: '["*"]'
      TRUSTED_HOSTS: '["localhost","127.0.0.1","backend"]'
      RATE_LIMIT_REQUESTS: 60
      RATE_LIMIT_WINDOW_SECONDS: 60
      MAX_REQUEST_BODY_BYTES: 262144
      MAX_MESSAGE_LENGTH: 4000
      COMPLIANCE_EMBEDDING_PROVIDER: openrouter
      COMPLIANCE_EMBEDDING_MODEL: nvidia/llama-nemotron-embed-vl-1b-v2:free
      COMPLIANCE_EMBEDDING_DIM: 2048
      COMPLIANCE_QDRANT_URL: http://qdrant:6333
      COMPLIANCE_EVIDENCE_PATH: /app/data/evidence
      COMPLIANCE_APSCHEDULER_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      # Evidence files must survive container replacement.
      - evidence_data:/app/data/evidence
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  qdrant_data:
  evidence_data:
