[project]
name = "agent-api"
version = "0.1.0"
description = "Production-oriented general-purpose tool-using agent. FastAPI backend, LangGraph agent loop, OpenRouter free models, PostgreSQL state/audit store."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "langgraph>=0.6.0,<0.7.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langgraph-checkpoint-postgres>=3.0.0,<4.0.0",
    # Bundled libpq — the LangGraph Postgres checkpointer uses psycopg (sync)
    # and slim/container images do not ship libpq.
    "psycopg[binary]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.29.0,<0.30.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "anyio>=4.4.0,<5.0.0",
    "mcp>=1.27.2",
    "qdrant-client>=1.19.1",
    "alembic>=1.20.0",
]

[project.optional-dependencies]
# On-prem/local embeddings for sensitive documents. Not installed by default:
# pulls in torch (~2GB). Install with: uv sync --extra local
local = [
    "sentence-transformers>=6.1.0",
]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "httpx>=0.27.0,<0.28.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_api*", "compliance*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = false
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "httpx>=0.27.0,<0.28.0",
]
